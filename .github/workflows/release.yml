# Pushing a version tag (v1.2.3) publishes a GitHub release for it, with that version's section
# of CHANGELOG.md ("## 1.2.3 ..." up to the next "## ") as the release notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / {
              if (found) exit
              heading = $2; gsub(/^\[|\]$/, "", heading); sub(/^v/, "", heading)
              if (heading == v) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          fi
          # Relative links (MIGRATION.md, README.md#…) point at the files as of this tag.
          sed -E -i "s#\]\((\./)?([A-Za-z0-9._/-]+\.md)(\#[^)]*)?\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\2\3)#g" notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
